[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-anakin"
version = "0.3.0"
description = "An integration package connecting Anakin and LangChain"
license = { text = "Apache-2.0" }
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "langchain-core>=0.3.0,<2.0.0",
    "anakin-sdk>=0.2.0,<0.3.0",
]

[project.urls]
Homepage = "https://anakin.io"
Documentation = "https://anakin.io/docs"
Repository = "https://github.com/Anakin-Inc/anakin-langchain"
Issues = "https://github.com/Anakin-Inc/anakin-langchain/issues"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
]
typing = [
    "mypy>=1.10.0,<2.0.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"

[tool.mypy]
disallow_untyped_defs = true

# anakin-sdk 0.2.0 is not on PyPI yet: develop against the sibling checkout.
# Drop this once it is published (uv sources never reach the built wheel).
[tool.uv.sources]
anakin-sdk = { path = "../anakin-py", editable = true }
