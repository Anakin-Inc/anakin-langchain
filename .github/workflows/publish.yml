name: Publish to PyPI

# Release: bump the version in pyproject.toml and langchain_anakin/_version.py,
# merge to main, then push a matching tag:
#   git tag v0.4.0 && git push origin v0.4.0
#
# Uses PyPI trusted publishing: the langchain-anakin project on PyPI needs a
# trusted publisher for this repository, workflow publish.yml and environment
# "pypi". No API token is stored.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          code_version=$(sed -nE 's/^__version__ = "(.*)"$/\1/p' langchain_anakin/_version.py)
          if [ "${REF_NAME#v}" != "$version" ] || [ "$version" != "$code_version" ]; then
            echo "::error::Tag $REF_NAME, pyproject.toml ($version) and _version.py ($code_version) must match"
            exit 1
          fi
      - name: Test
        run: |
          uv sync --locked --group test
          uv run pytest
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-anakin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
